<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0a0821}
  body{
    font-family:"DejaVu Sans","Liberation Sans",Arial,sans-serif;
    background:#0a0821;
    position:relative;
    display:flex;align-items:center;
  }
  .bg{position:fixed;inset:0;background:linear-gradient(135deg,#241f63 0%,#141034 42%,#0a0821 100%)}
  .glow{
    position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;
  }
  .g1{width:900px;height:900px;background:#4f46e5;left:-260px;top:-330px;opacity:.42}
  .g2{width:760px;height:760px;background:#7c3aed;right:-220px;bottom:-330px;opacity:.38}
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:48px 48px;
  }
  .wrap{position:relative;display:flex;align-items:center;gap:64px;padding:0 84px;width:100%}
  .left{flex:1}
  .mark{display:flex;align-items:center;gap:18px;margin-bottom:34px}
  .badge{
    width:74px;height:74px;border-radius:20px;
    background:linear-gradient(140deg,#6366f1,#8b5cf6);
    display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:800;color:#fff;
    box-shadow:0 12px 40px rgba(99,102,241,.5);
  }
  h1{font-size:76px;line-height:1;font-weight:800;color:#fff;letter-spacing:-2px}
  h1 span{color:#a5b4fc}
  p.tag{margin-top:26px;font-size:31px;line-height:1.35;color:#c7d2fe;font-weight:500;max-width:620px}
  ul{margin-top:34px;display:flex;gap:14px;list-style:none;flex-wrap:wrap}
  li{
    font-size:20px;color:#e0e7ff;font-weight:600;
    border:1px solid rgba(165,180,252,.35);
    background:rgba(99,102,241,.14);
    padding:10px 20px;border-radius:999px;
  }
  .doc{
    width:322px;height:436px;border-radius:18px;background:#fff;flex:none;
    box-shadow:0 30px 80px rgba(0,0,0,.55);padding:30px 28px;
    transform:rotate(3deg);
  }
  .doc .h{height:15px;width:62%;border-radius:4px;background:#4f46e5;margin-bottom:11px}
  .doc .s{height:9px;width:44%;border-radius:4px;background:#c7d2fe;margin-bottom:26px}
  .doc .rule{height:2px;background:#eef2ff;margin:20px 0}
  .doc .l{height:9px;border-radius:4px;background:#e5e7eb;margin-bottom:11px}
  .doc .l.w1{width:100%}.doc .l.w2{width:88%}.doc .l.w3{width:94%}.doc .l.w4{width:70%}
  .doc .sec{height:11px;width:38%;border-radius:4px;background:#312e81;margin:0 0 15px}
</style></head><body>
  <div class="bg"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="mark">
        <div class="badge">D</div>
        <h1>Dexa<span>CV</span></h1>
      </div>
      <p class="tag">Build an ATS-ready CV in minutes.<br>No account. No watermark.</p>
      <ul><li>AI writing help</li><li>PDF &amp; DOCX</li><li>Cover letters</li></ul>
    </div>
    <div class="doc">
      <div class="h"></div><div class="s"></div>
      <div class="sec"></div>
      <div class="l w1"></div><div class="l w2"></div><div class="l w3"></div>
      <div class="rule"></div>
      <div class="sec"></div>
      <div class="l w2"></div><div class="l w1"></div><div class="l w4"></div>
      <div class="rule"></div>
      <div class="sec"></div>
      <div class="l w3"></div><div class="l w4"></div>
    </div>
  </div>
</body></html>
